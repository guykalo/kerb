<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Streety · Sydney parking</title>
  <link rel="canonical" href="https://getstreety.com.au/">
  <meta property="og:site_name" content="Streety">
  <meta property="og:title" content="Streety · Sydney parking">
  <meta property="og:description" content="Where it's free right now, what the meters cost, how long you can stay, and what a fine would cost.">
  <meta property="og:url" content="https://getstreety.com.au/">
  <script>if (location.hostname === 'www.getstreety.com.au') location.replace('https://getstreety.com.au' + location.pathname + location.search + location.hash);</script>
  <meta name="description" content="Sydney parking on one map: where it's free right now, what the meters cost, how long you can stay, and how full the car parks get.">
  <meta name="theme-color" content="#0e1a24" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef3f5" media="(prefers-color-scheme: light)">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Streety">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
</head>
<body>
  <div class="app" id="app">
    <div class="map" id="map" aria-label="Map of kerbs"></div>

    <header class="topbar">
      <button class="brand" id="cityBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Streety: choose a city">
        <span class="mark" aria-hidden="true">S</span><span class="word">Streety</span><span class="cityname" id="cityName">Sydney</span><i class="ph ph-caret-down caret" aria-hidden="true"></i>
      </button>
      <div class="citymenu" id="cityMenu" role="menu" hidden></div>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <label class="sr" for="q">Search a street or place</label>
        <input id="q" type="search" placeholder="Where to?" enterkeyhint="search">
        <ul class="results" id="results" role="listbox" hidden></ul>
      </form>
      <button class="iconbtn" id="locate" type="button" aria-label="Show my location"><i class="ph ph-crosshair"></i></button>
    </header>

    <section class="panel" id="panel" aria-label="Parking options">
      <button class="handle" id="handle" type="button" aria-label="Expand or collapse the options"><span></span></button>

      <div class="dock" id="dock">
        <!-- 1. What you're looking for, in one sentence (also all that shows when the sheet is lowered) -->
        <button class="dock-row ask" id="ask" type="button" aria-controls="setup" aria-expanded="false"></button>

        <!-- The questions: folded away on phones until you tap Change, so the map stays big -->
        <div class="setup" id="setup">
        <!-- 2. How long -->
        <div class="q">
          <div class="qlabel" id="stayLabel">How long are you staying?</div>
          <div class="stay" role="group" aria-labelledby="stayLabel" id="staySeg">
            <button type="button" data-v="0.25" aria-label="15 minutes"><b>15</b><small>min</small></button><button type="button" data-v="1" aria-label="1 hour"><b>1</b><small>hour</small></button><button type="button" data-v="2" aria-label="2 hours"><b>2</b><small>hours</small></button><button type="button" data-v="3" aria-label="3 hours"><b>3</b><small>hours</small></button><button type="button" data-v="4" aria-label="4 hours"><b>4</b><small>hours</small></button><button type="button" data-v="8" aria-label="8 hours"><b>8</b><small>hours</small></button><button type="button" data-v="night" aria-label="Overnight, until 8am"><b><i class="ph-fill ph-moon"></i></b><small>night</small></button>
          </div>
        </div>

        <!-- 3. When you get there -->
        <div class="q">
          <div class="qlabel" id="arriveLabel">When do you arrive?</div>
          <div class="arrive" role="group" aria-labelledby="arriveLabel">
            <label class="daypick"><span class="sr">Day</span><select id="daySel"></select><i class="ph ph-caret-down" aria-hidden="true"></i></label>
            <div class="clock">
              <button type="button" class="step" id="timeDown" aria-label="30 minutes earlier"><i class="ph ph-minus"></i></button>
              <output id="timeOut" for="time"></output>
              <button type="button" class="step" id="timeUp" aria-label="30 minutes later"><i class="ph ph-plus"></i></button>
            </div>
          </div>
        </div>

        <!-- 4. The day at a glance: drag along it to change the arrival time -->
        <div class="ribbon-cap"><span id="ribbonTitle">Parking on this map today</span><span class="mini-key"><i class="k-free"></i>Free<i class="k-meter"></i>Paid<i class="k-no"></i>No</span></div>
        <div class="ribbon" id="ribbon">
          <canvas id="ribbonCanvas" aria-hidden="true"></canvas>
          <div class="staybox" id="stayBox" aria-hidden="true"></div>
          <input id="time" type="range" min="0" max="23.75" step="0.25" aria-label="Arrival time">
          <div class="ticks" aria-hidden="true"><span>12am</span><span>6am</span><span>noon</span><span>6pm</span><span>12am</span></div>
        </div>
        </div>
      </div>

      <div class="body" id="body"></div>
    </section>

    <div class="legend" id="legend" aria-label="Map key"></div>
    <button class="iconbtn snapbtn" id="snapBtn" type="button" aria-label="Snap a parking sign"><i class="ph-fill ph-camera"></i></button>
    <input type="file" id="snapFile" accept="image/*" capture="environment" hidden>
    <button class="iconbtn satbtn" id="satBtn" type="button" aria-label="Show satellite photos" aria-pressed="false"><i class="ph ph-globe-hemisphere-east"></i></button>
    <button class="iconbtn fullbtn" id="fullBtn" type="button" aria-label="Full screen map" aria-pressed="false"><i class="ph ph-arrows-out-simple"></i></button>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
