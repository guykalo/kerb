name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 16 * * *' # 3:17am Sydney (AEDT), every night
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Last night's downloads, so a council server that's down doesn't blank its area.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Get council parking decisions
        run: (git fetch -q origin council-decisions && git show origin/council-decisions:decisions-cos.json > data/decisions-cos.json) || echo "no decisions yet"
      - name: Save the live data (fallback if a council server is down)
        run: |
          mkdir -p data/published
          for f in kerbs rules meters carparks; do curl -fsSL "https://guykalo.github.io/kerb/data/$f.json" -o "data/published/$f.json" || true; done
      - name: Download open parking data
        id: fetch
        continue-on-error: true
        run: npm run data:fetch
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      - name: Build kerb data
        id: kerbdata
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: npm run data:build
      # If today's download or build failed, keep the map that's live now and still ship app changes.
      - name: Keep the published data
        if: steps.fetch.outcome != 'success' || steps.kerbdata.outcome != 'success'
        run: |
          mkdir -p public/data
          for f in meta kerbs rules meters carparks; do curl -fsSL "https://guykalo.github.io/kerb/data/$f.json" -o "public/data/$f.json"; done
      - name: Build app
        run: npm run build
        env:
          VITE_MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          VITE_SIGN_READ_URL: ${{ secrets.VITE_SIGN_READ_URL }}
          VITE_SNAP_SHARE_URL: ${{ secrets.VITE_SNAP_SHARE_URL }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
