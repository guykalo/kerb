name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 16 * * *' # 3:17am Sydney (AEDT), every night
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Where the live app is. Its data files are the fallback when a council server is down.
  SITE: https://guykalo.github.io/kerb
  CF_PROJECT: streety

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Full data refresh at night, on "Run workflow", or when a push touches the data scripts.
      # Other pushes (app changes) reuse the live data: about 1 minute instead of 8, which keeps
      # GitHub Actions inside the free minutes once the repo is private.
      - name: Decide whether to refresh data
        id: mode
        run: |
          full=true
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"; git cat-file -e "$base" 2>/dev/null || base=HEAD~1
            if git diff --name-only "$base" HEAD 2>/dev/null | grep -vE '^scripts/(audit|audit-browser|seo-pages)\.mjs$' | grep -qE '^(scripts/|data/|package(-lock)?\.json)'; then full=true; else full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full data refresh: $full"
      # Last night's downloads, so a council server that's down doesn't blank its area.
      - uses: actions/cache@v4
        if: steps.mode.outputs.full == 'true'
        with:
          path: |
            data/raw
            data/raw-cities
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Get council parking decisions
        if: steps.mode.outputs.full == 'true'
        run: (git fetch -q origin council-decisions && git show origin/council-decisions:decisions-cos.json > data/decisions-cos.json) || echo "no decisions yet"
      - name: Save the live data (fallback if a council server is down)
        if: steps.mode.outputs.full == 'true'
        run: |
          mkdir -p data/published
          for f in kerbs rules meters carparks; do curl -fsSL "$SITE/data/$f.json" -o "data/published/$f.json" || true; done
      - name: Download open parking data
        id: fetch
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: npm run data:fetch
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      - name: Build kerb data
        id: kerbdata
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: npm run data:build
      # Melbourne, Brisbane and Perth: each city builds on its own and keeps last night's download if its server is down.
      - name: Build other cities
        id: cities
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: npm run data:cities
      # NSW parking fines: amounts by offence and fines per council (Revenue NSW open data).
      - name: Build fines data
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: node scripts/build-fines.mjs
      - name: Keep the published data for any city not built today
        run: |
          mkdir -p public/data
          [ -f public/data/fines.json ] || curl -fsSL "$SITE/data/fines.json" -o public/data/fines.json || rm -f public/data/fines.json
          for c in mel bne per; do
            if [ ! -f "public/data/$c/meta.json" ]; then
              mkdir -p "public/data/$c"
              for f in meta kerbs rules meters carparks bays; do curl -fsSL "$SITE/data/$c/$f.json" -o "public/data/$c/$f.json" || rm -f "public/data/$c/$f.json"; done
            fi
          done
      # If today's download or build failed (or was skipped), keep the map that's live now and still ship app changes.
      - name: Keep the published data
        if: steps.fetch.outcome != 'success' || steps.kerbdata.outcome != 'success'
        run: |
          mkdir -p public/data
          for f in meta kerbs rules meters carparks; do curl -fsSL "$SITE/data/$f.json" -o "public/data/$f.json"; done
      # The Cloudflare account: from the secret, or else the one the token belongs to.
      - name: Find the Cloudflare account
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env:
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          V=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{ok: .success, status: .result.status, errors: [.errors[]?.message]}')
          L=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          echo "::notice title=Cloudflare token::$V; accounts the token can see: $(echo "$L" | jq '.result | length'); account secret set: $([ -n "$A" ] && echo yes, ${#A} characters || echo no)"
          if [ -z "$A" ]; then A=$(echo "$L" | jq -r '.result[0].id // empty'); fi
          [ -n "$A" ] && echo "CF_ACCOUNT=$A" >> "$GITHUB_ENV"
      # Streety's small server (reports and shared sign readings), once the Cloudflare token is in the repo secrets.
      - name: Deploy the Streety server
        id: worker
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CF_ACCOUNT }}
        run: |
          set -o pipefail
          node scripts/deploy-worker.mjs 2>&1 | tee worker.log || { echo "::error title=Streety server::$(tail -c 900 worker.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Streety server::$(grep '^server:' worker.log)"
      - name: Build app
        run: npm run build
        env:
          VITE_MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          VITE_SIGN_READ_URL: ${{ secrets.VITE_SIGN_READ_URL }}
          VITE_SNAP_SHARE_URL: ${{ secrets.VITE_SNAP_SHARE_URL || (steps.worker.outputs.url && format('{0}/snap', steps.worker.outputs.url)) || '' }}
          VITE_REPORT_URL: ${{ secrets.VITE_REPORT_URL || (steps.worker.outputs.url && format('{0}/report', steps.worker.outputs.url)) || '' }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
      # Never blocks the GitHub Pages deploy below; the reason shows as an annotation on the run.
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CF_ACCOUNT }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch main 2>&1 | tee pages.log || echo "::warning title=Pages project::$(tail -c 600 pages.log | tr '\n' ' ')"
          npx --yes wrangler@4 pages deploy dist --project-name "$CF_PROJECT" --branch main --commit-dirty=true 2>&1 | tee -a pages.log || { echo "::error title=Cloudflare Pages::$(tail -c 900 pages.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Cloudflare Pages::$(grep -o 'https://[^ ]*pages.dev' pages.log | tail -1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
