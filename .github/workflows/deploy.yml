name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 16 * * *' # 3:17am Sydney (AEDT), every night
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Where the live app is. Its data files are the fallback when a council server is down.
  SITE: https://guykalo.github.io/kerb
  CF_PROJECT: kerb-sydney

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Full data refresh at night, on "Run workflow", or when a push touches the data scripts.
      # Other pushes (app changes) reuse the live data: about 1 minute instead of 8, which keeps
      # GitHub Actions inside the free minutes once the repo is private.
      - name: Decide whether to refresh data
        id: mode
        run: |
          full=true
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"; git cat-file -e "$base" 2>/dev/null || base=HEAD~1
            if git diff --name-only "$base" HEAD 2>/dev/null | grep -qE '^(scripts/|data/|package(-lock)?\.json)'; then full=true; else full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full data refresh: $full"
      # Last night's downloads, so a council server that's down doesn't blank its area.
      - uses: actions/cache@v4
        if: steps.mode.outputs.full == 'true'
        with:
          path: |
            data/raw
            data/raw-cities
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Get council parking decisions
        if: steps.mode.outputs.full == 'true'
        run: (git fetch -q origin council-decisions && git show origin/council-decisions:decisions-cos.json > data/decisions-cos.json) || echo "no decisions yet"
      - name: Save the live data (fallback if a council server is down)
        if: steps.mode.outputs.full == 'true'
        run: |
          mkdir -p data/published
          for f in kerbs rules meters carparks; do curl -fsSL "$SITE/data/$f.json" -o "data/published/$f.json" || true; done
      - name: Download open parking data
        id: fetch
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: npm run data:fetch
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      - name: Build kerb data
        id: kerbdata
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: npm run data:build
      # Melbourne, Brisbane and Perth: each city builds on its own and keeps last night's download if its server is down.
      - name: Build other cities
        id: cities
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: npm run data:cities
      - name: Keep the published data for any city not built today
        run: |
          for c in mel bne per; do
            if [ ! -f "public/data/$c/meta.json" ]; then
              mkdir -p "public/data/$c"
              for f in meta kerbs rules meters carparks bays; do curl -fsSL "$SITE/data/$c/$f.json" -o "public/data/$c/$f.json" || rm -f "public/data/$c/$f.json"; done
            fi
          done
      # If today's download or build failed (or was skipped), keep the map that's live now and still ship app changes.
      - name: Keep the published data
        if: steps.fetch.outcome != 'success' || steps.kerbdata.outcome != 'success'
        run: |
          mkdir -p public/data
          for f in meta kerbs rules meters carparks; do curl -fsSL "$SITE/data/$f.json" -o "public/data/$f.json"; done
      - name: Build app
        run: npm run build
        env:
          VITE_MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          VITE_SIGN_READ_URL: ${{ secrets.VITE_SIGN_READ_URL }}
          VITE_SNAP_SHARE_URL: ${{ secrets.VITE_SNAP_SHARE_URL }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name "$CF_PROJECT" --branch main --commit-dirty=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
