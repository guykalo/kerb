name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 16 * * *' # 3:17am Sydney (AEDT), every night
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download open parking data
        run: npm run data:fetch
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      - name: Build kerb data
        run: npm run data:build
      - name: Build app
        run: npm run build
        env:
          VITE_MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
