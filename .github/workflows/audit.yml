name: Audit the live map
on:
  workflow_run:
    workflows: ['Refresh data and deploy']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Data checks
        run: node scripts/audit.mjs
      - name: Browser checks (every city loads, no page errors)
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.47 && npx playwright install --with-deps chromium >/dev/null
          node scripts/audit-browser.mjs
      - name: Publish the report to the audit branch
        run: |
          cd audit && git init -q -b audit
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Audit $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" audit
