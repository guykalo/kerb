name: Fetch council documents
on:
  workflow_dispatch:
  push:
    paths: ['data/doc-urls.txt', 'scripts/fetch-docs.mjs']
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-docs.mjs
      # Keep the documents on their own branch (not the site), so they can be read and turned into rules.
      - run: |
          cd docs
          git init -q -b council-docs
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Council documents $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" council-docs
