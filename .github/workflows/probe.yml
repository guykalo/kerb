name: Probe (one-off data check)
on:
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
        continue-on-error: true
      - run: cd probe && node run.mjs 2>&1 | tee run.log; mkdir -p out; cp run.log out/ || true
        continue-on-error: true
      - run: |
          cd probe/out
          git init -q -b probe-out
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Probe $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-out
