name: Probe Streety server
on:
  push:
    branches: ['probe/server']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; W=https://streety.guyraner.workers.dev; O=https://guykalo.github.io
          {
          J=$(python3 -c "import base64,struct,zlib;print('/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=')")
          echo "== POST /report (sign, photo)"; curl -sS -H "Origin: $O" -H 'content-type: application/json' -d "{\"kind\":\"sign\",\"title\":\"Test street (setup check, close me)\",\"target\":\"kerb\",\"city\":\"syd\",\"at\":[151.2093,-33.8688],\"note\":\"Test report from the setup. You can close this.\",\"photo\":\"data:image/jpeg;base64,$J\",\"time\":\"$(date -u +%FT%TZ)\"}" $W/report; echo
          } > out/result.txt 2>&1
          cd out && git init -q -b probe-server-out && git config user.name gh && git config user.email gh@users.noreply.github.com && git add -A && git commit -qm out && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-server-out
