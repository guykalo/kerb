name: Probe fetch pages
on:
  push:
    branches: ['probe/fetch']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: |
          echo skip
      - run: |
          mkdir -p out && cd out
          curl -sSL "https://s3.ap-southeast-2.amazonaws.com/dmzweb.adelaidecitycouncil.com/OpenData/On_Street_Parking/ParkingReport.csv" -o adl-zones.csv || true
          curl -sSL "https://s3.ap-southeast-2.amazonaws.com/dmzweb.adelaidecitycouncil.com/OpenData/On_Street_Parking/Parkingcurrent.kmz" -o adl-zones.kmz || true
          curl -sSL "https://s3.ap-southeast-2.amazonaws.com/dmzweb.adelaidecitycouncil.com/OpenData/Parking_Machines/ParkingMachines.csv" -o adl-machines.csv || true
          (mkdir kmz && cd kmz && unzip -o -q ../adl-zones.kmz) || true
          ls -laR . | head -30
      - run: |
          cd out && git init -q -b probe-fetch-out
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "fetch $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-fetch-out
