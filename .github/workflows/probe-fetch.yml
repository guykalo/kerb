name: Probe fetch pages
on:
  push:
    branches: ['probe/fetch']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: |
          echo skip
      - run: |
          mkdir -p out && cd out
          pip install -q openpyxl pandas >/dev/null 2>&1 || true
          curl -sSL "https://www.revenue.nsw.gov.au/help-centre/resources-library/statistics/penalty-notice-data-2023-2024-dfosf-001-2023.xlsx" -o pn.xlsx || true
          curl -sSL "https://data.nsw.gov.au/data/api/3/action/package_show?id=penalty-notice-data-set" -o pn-pkg.json || true
          curl -sSL "https://www.cityofsydney.nsw.gov.au/-/media/corporate/files/publications/council-governance-administration/parking-penalty-notice-report/website-report---the-council-of-the-city-of-sydney---1-january-2026-to-30-june-2026.xlsx?download=true" -o cos-fines.xlsx || true
          curl -sSL "https://data.gov.au/data/api/3/action/package_show?id=a5ee3bca-98d8-42d9-a319-782029bd4336" -o top500-pkg.json || true
          python3 - <<'PY' > xlsx-summary.txt 2>&1
          import pandas as pd
          for f in ['pn.xlsx','cos-fines.xlsx']:
              try:
                  x = pd.ExcelFile(f)
                  print('=====', f, x.sheet_names)
                  for sh in x.sheet_names[:4]:
                      d = pd.read_excel(f, sheet_name=sh, header=None, nrows=40)
                      print('---', sh, d.shape); print(d.to_string(max_colwidth=40)[:6000])
              except Exception as e: print(f, 'ERR', e)
          PY
          ls -la
      - run: |
          cd out && git init -q -b probe-fetch-out
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "fetch $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-fetch-out
