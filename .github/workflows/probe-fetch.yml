name: Probe fetch pages
on:
  push:
    branches: ['probe/fetch']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo skip
      - run: |
          mkdir -p out
          curl -sSL "https://data.gov.au/data/dataset/9304b79f-866f-40a1-afea-53ccded06ecd/resource/2d715933-43fc-47fa-8a6c-92422e8ab81d/download/city-of-port-phillip-parking-machines.geojson" -o out/pp-machines.geojson || true
          curl -sS -w "%{http_code}
" "https://vicdata.vicroads.vic.gov.au/server/rest/services/Hosted/Clearways/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=3&f=json&outSR=4326" -o out/vic-clearways-sample.json > out/vic.status 2>&1 || true
          ls -la out
      - run: |
          cd out && git init -q -b probe-fetch-out
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "fetch $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-fetch-out
