name: Probe fetch pages
on:
  push:
    branches: ['probe/fetch']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo skip
      - run: |
          mkdir -p out; q='[out:json][timeout:60];nwr[amenity=parking](-33.965,151.15,-33.915,151.2);out center tags;'
          curl -sS -A "Kerb parking map (github.com/guykalo/kerb)" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter -o out/airport-parking.json || curl -sS -A "Kerb" --data-urlencode "data=$q" https://overpass.private.coffee/api/interpreter -o out/airport-parking.json; ls -la out
      - run: |
          cd out && git init -q -b probe-fetch-out
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "fetch $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-fetch-out
